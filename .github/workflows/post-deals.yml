name: Post Amazon deals

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (GitHub may delay a few min)
  workflow_dispatch: {} # allows manual "Run workflow" button

permissions:
  contents: write # needed to commit posted.json back

concurrency:
  group: post-deals

jobs:
  post-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run deal bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHANNEL_ID" ] || [ -z "$AMAZON_TAG" ]; then
            echo "::notice::Secrets not configured yet — skipping run."
            exit 0
          fi
          python bot.py

      - name: Save posted-deals state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "chore: update posted deals state [skip ci]" && git push)
